name: QA microinteraction v2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-microinteraction-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  microinteraction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production output
        run: npm run build

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start preview server
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/qa-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/qa-preview.log
          exit 1

      - name: Run comprehensive microinteraction audit
        run: node scripts/browser-microinteraction-audit-v2.mjs
