name: Hero UX audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hero-ux-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hero-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependency graph
        run: npm audit --audit-level=low

      - name: Build production output
        run: npm run build

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Start preview server
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/hero-ux-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/hero-ux-preview.log
          exit 1

      - name: Run hero interaction regression audit
        run: node scripts/browser-hero-ux-audit-v26.mjs
