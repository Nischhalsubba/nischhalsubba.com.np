name: Browser audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: browser-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependency graph
        run: npm audit --audit-level=low

      - name: Build and validate static output
        run: npm run validate

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Start preview server
        id: preview
        continue-on-error: true
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Audit every sitemap route and viewport
        id: browser
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/browser-audit.mjs 2>&1 | tee browser-audit.log
          node scripts/browser-sticky-responsive-audit.mjs 2>&1 | tee -a browser-audit.log

      - name: Audit refined button motion
        id: motion
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:button-motion:browser 2>&1 | tee button-motion-audit.log

      - name: Audit text contrast in light and dark themes
        id: contrast
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/browser-theme-contrast-audit.mjs 2>&1 | tee contrast-audit.log

      - name: Audit contact form accessibility
        id: contact
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/browser-contact-audit.mjs 2>&1 | tee contact-audit.log

      - name: Compare visual regression baselines
        id: visual
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if ! find tests/visual/baselines -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            echo 'Reviewed visual baselines are missing. Generate and review them before merging.' | tee visual-regression.log
            exit 1
          fi
          node scripts/visual-regression.mjs 2>&1 | tee visual-regression.log

      - name: Publish browser audit result
        if: always() && !cancelled()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          MOTION_OUTCOME: ${{ steps.motion.outcome }}
          CONTRAST_OUTCOME: ${{ steps.contrast.outcome }}
          CONTACT_OUTCOME: ${{ steps.contact.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[CI] Browser audit failure';
            const { owner, repo } = context.repo;
            const outcomes = {
              preview: process.env.PREVIEW_OUTCOME,
              browser: process.env.BROWSER_OUTCOME,
              motion: process.env.MOTION_OUTCOME,
              contrast: process.env.CONTRAST_OUTCOME,
              contact: process.env.CONTACT_OUTCOME,
              visual: process.env.VISUAL_OUTCOME,
            };
            const passed = Object.values(outcomes).every((value) => value === 'success');
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (passed) {
              if (existing && existing.state === 'open') {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', body: `Browser, button-motion, contrast, contact, and visual audits passed on ${context.sha}.\n\nRun: ${runUrl}` });
              }
              return;
            }
            const sections = [`Browser audit failed on commit \`${context.sha}\`.`, '', `Run: ${runUrl}`, '', `Outcomes: ${JSON.stringify(outcomes)}`];
            for (const [label, file] of [
              ['Preview server', '/tmp/portfolio-preview.log'],
              ['Route and viewport audit', 'site/browser-audit.log'],
              ['Refined button motion audit', 'site/button-motion-audit.log'],
              ['Theme contrast audit', 'site/contrast-audit.log'],
              ['Contact accessibility audit', 'site/contact-audit.log'],
              ['Visual regression audit', 'site/visual-regression.log'],
            ]) {
              if (!fs.existsSync(file)) continue;
              sections.push('', `<details><summary>${label}</summary>`, '', '```text', fs.readFileSync(file, 'utf8').slice(-50000), '```', '</details>');
            }
            const body = sections.join('\n');
            if (existing) await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'open', body });
            else await github.rest.issues.create({ owner, repo, title, body });

      - name: Upload browser and visual audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-audit-artifacts
          path: |
            /tmp/portfolio-preview.log
            site/browser-audit.log
            site/button-motion-audit.log
            site/contrast-audit.log
            site/contact-audit.log
            site/visual-regression.log
            site/tests/visual/baselines
            site/tests/visual/results
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail workflow when browser validation fails
        if: always() && !cancelled()
        env:
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          MOTION_OUTCOME: ${{ steps.motion.outcome }}
          CONTRAST_OUTCOME: ${{ steps.contrast.outcome }}
          CONTACT_OUTCOME: ${{ steps.contact.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        shell: bash
        run: |
          normalize() {
            printf '%s' "$1" | tr -d "'\"[:space:]"
          }
          preview=$(normalize "$PREVIEW_OUTCOME")
          browser=$(normalize "$BROWSER_OUTCOME")
          motion=$(normalize "$MOTION_OUTCOME")
          contrast=$(normalize "$CONTRAST_OUTCOME")
          contact=$(normalize "$CONTACT_OUTCOME")
          visual=$(normalize "$VISUAL_OUTCOME")
          echo "Audit outcomes: preview=$preview browser=$browser motion=$motion contrast=$contrast contact=$contact visual=$visual"
          if [ "$preview" != "success" ] || [ "$browser" != "success" ] || [ "$motion" != "success" ] || [ "$contrast" != "success" ] || [ "$contact" != "success" ] || [ "$visual" != "success" ]; then
            exit 1
          fi
