name: Browser audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: browser-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate static output
        run: npm run validate

      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.54.1 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Start preview server
        id: preview
        continue-on-error: true
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Audit every sitemap route and viewport
        id: browser
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/browser-audit.mjs 2>&1 | tee browser-audit.log

      - name: Audit contact form accessibility
        id: contact
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/browser-contact-audit.mjs 2>&1 | tee contact-audit.log

      - name: Compare visual regression baselines
        id: visual
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if find tests/visual/baselines -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            node scripts/visual-regression.mjs 2>&1 | tee visual-regression.log
          else
            UPDATE_VISUAL_BASELINES=1 node scripts/visual-regression.mjs 2>&1 | tee visual-regression.log
            echo 'Initial visual baselines generated for review and repository bootstrap.' | tee -a visual-regression.log
            exit 1
          fi

      - name: Commit reviewed initial visual baselines
        id: baseline_bootstrap
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.visual.outcome == 'failure'
        shell: bash
        run: |
          if git ls-files 'tests/visual/baselines/*.png' | grep -q .; then
            echo 'Tracked baselines already exist; visual changes require manual review.'
            exit 0
          fi
          if ! find tests/visual/baselines -type f -name '*.png' -print -quit 2>/dev/null | grep -q .; then
            echo 'No generated baseline screenshots were found.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual/baselines/*.png
          git commit -m 'test: add reviewed visual regression baselines'
          git push origin HEAD:main

      - name: Publish browser audit result
        if: always()
        uses: actions/github-script@v7
        env:
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          CONTACT_OUTCOME: ${{ steps.contact.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[CI] Browser audit failure';
            const { owner, repo } = context.repo;
            const outcomes = {
              preview: process.env.PREVIEW_OUTCOME,
              browser: process.env.BROWSER_OUTCOME,
              contact: process.env.CONTACT_OUTCOME,
              visual: process.env.VISUAL_OUTCOME,
            };
            const passed = Object.values(outcomes).every((value) => value === 'success');
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (passed) {
              if (existing && existing.state === 'open') {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                  body: `Browser and visual audits passed on ${context.sha}.\n\nRun: ${runUrl}`,
                });
              }
              return;
            }

            const sections = [`Browser audit failed on commit \`${context.sha}\`.`, '', `Run: ${runUrl}`, '', `Outcomes: ${JSON.stringify(outcomes)}`];
            for (const [label, file] of [
              ['Preview server', '/tmp/portfolio-preview.log'],
              ['Route and viewport audit', 'browser-audit.log'],
              ['Contact accessibility audit', 'contact-audit.log'],
              ['Visual regression audit', 'visual-regression.log'],
            ]) {
              if (!fs.existsSync(file)) continue;
              sections.push('', `<details><summary>${label}</summary>`, '', '```text', fs.readFileSync(file, 'utf8').slice(-50000), '```', '</details>');
            }
            const body = sections.join('\n');

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'open', body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Upload browser and visual audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-artifacts
          path: |
            /tmp/portfolio-preview.log
            browser-audit.log
            contact-audit.log
            visual-regression.log
            tests/visual/baselines
            tests/visual/results
          if-no-files-found: ignore
          retention-days: 7

      - name: Assert browser validation passed
        if: always()
        env:
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          CONTACT_OUTCOME: ${{ steps.contact.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        shell: bash
        run: |
          if [[ "$PREVIEW_OUTCOME" != "success" || "$BROWSER_OUTCOME" != "success" || "$CONTACT_OUTCOME" != "success" || "$VISUAL_OUTCOME" != "success" ]]; then
            echo "Browser validation failed: preview=$PREVIEW_OUTCOME browser=$BROWSER_OUTCOME contact=$CONTACT_OUTCOME visual=$VISUAL_OUTCOME"
            exit 1
          fi
