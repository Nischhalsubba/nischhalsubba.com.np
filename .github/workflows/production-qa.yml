name: Production QA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-qa
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUDIT_BASE_URL: https://nischhalsubba.com.np
      SITE_URL: https://nischhalsubba.com.np
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for exact Cloudflare Workers production commit
        shell: bash
        run: |
          set -o pipefail
          matched=0
          for attempt in $(seq 1 36); do
            live_info=$(curl -fsS --max-time 10 "$SITE_URL/build-info.json" || true)
            live_sha=$(printf '%s' "$live_info" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit||'')}catch{console.log('')}})")
            live_branch=$(printf '%s' "$live_info" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).branch||'')}catch{console.log('')}})")
            live_provider=$(printf '%s' "$live_info" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).provider||'')}catch{console.log('')}})")
            echo "Production QA provenance $attempt: live=${live_sha:-unavailable} branch=${live_branch:-unknown} provider=${live_provider:-unknown} expected=$EXPECTED_SHA"
            if [ "$live_sha" = "$EXPECTED_SHA" ] && [ "$live_branch" = "main" ] && [ "$live_provider" = "cloudflare-workers" ]; then
              matched=1
              break
            fi
            sleep 10
          done
          [ "$matched" = "1" ] || {
            echo "Refusing to audit stale production. Expected Cloudflare Workers commit $EXPECTED_SHA."
            exit 1
          }
      - name: Fetch live sitemap for browser route discovery
        run: |
          mkdir -p dist
          curl --fail --silent --show-error https://nischhalsubba.com.np/sitemap.xml -o dist/sitemap.xml
      - name: Install Chromium audit runtime
        run: |
          npm install --no-save playwright@1.54.1 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify routes and redirects
        id: routes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:routes:live 2>&1 | tee production-routes.log
      - name: Audit all live routes and viewports
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/browser-audit.mjs 2>&1 | tee production-browser.log
      - name: Audit live contact accessibility
        id: contact
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/browser-contact-audit.mjs 2>&1 | tee production-contact.log
      - name: Audit live visual baselines
        id: visual
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/visual-regression.mjs 2>&1 | tee production-visual.log
      - name: Verify production security headers
        id: headers
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          headers=$(curl -fsSI https://nischhalsubba.com.np/ | tr -d '\r' | tr '[:upper:]' '[:lower:]')
          for header in content-security-policy strict-transport-security x-content-type-options referrer-policy permissions-policy cross-origin-opener-policy; do
            grep -q "^${header}:" <<<"$headers" || { echo "Missing $header" | tee -a production-headers.log; exit 1; }
          done
          echo 'Required production security headers passed.' | tee production-headers.log
      - name: Publish production QA issue
        if: always()
        uses: actions/github-script@v7
        env:
          ROUTES: ${{ steps.routes.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          CONTACT: ${{ steps.contact.outcome }}
          VISUAL: ${{ steps.visual.outcome }}
          HEADERS: ${{ steps.headers.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[QA] Production website audit';
            const outcomes = { routes: process.env.ROUTES, browser: process.env.BROWSER, contact: process.env.CONTACT, visual: process.env.VISUAL, headers: process.env.HEADERS };
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [`Production QA for \`${context.sha}\`.`, '', `Run: ${run}`, '', `Outcomes: \`${JSON.stringify(outcomes)}\``];
            for (const [label, file] of [['Routes','production-routes.log'],['Browser','production-browser.log'],['Contact','production-contact.log'],['Visual','production-visual.log'],['Headers','production-headers.log']]) {
              if (!fs.existsSync(file)) continue;
              body.push('', `<details><summary>${label}</summary>`, '', '```text', fs.readFileSync(file,'utf8').slice(-50000), '```', '</details>');
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'all', per_page:100});
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const passed = Object.values(outcomes).every(value => value === 'success');
            const payload = { ...context.repo, title, body: body.join('\n'), state: passed ? 'closed' : 'open' };
            if (existing) await github.rest.issues.update({ ...payload, issue_number: existing.number });
            else await github.rest.issues.create(payload);
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-qa-${{ github.sha }}
          path: |
            production-*.log
            tests/visual/results
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail when production QA fails
        if: steps.routes.outcome != 'success' || steps.browser.outcome != 'success' || steps.contact.outcome != 'success' || steps.visual.outcome != 'success' || steps.headers.outcome != 'success'
        run: exit 1
