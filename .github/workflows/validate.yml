name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: portfolio-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit declared dependencies
        run: npm run audit:dependencies

      - name: Build and run repository audits
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm run validate
            git diff --exit-code
          } 2>&1 | tee validation.log

      - name: Publish validation result
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[CI] Portfolio validation failure';
            const { owner, repo } = context.repo;
            const outcome = process.env.VALIDATION_OUTCOME;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (outcome === 'success') {
              if (existing && existing.state === 'open') {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', body: `Validation passed on ${context.sha}.\n\nRun: ${runUrl}` });
              }
              return;
            }
            const logPath = 'site/validation.log';
            const rawLog = fs.existsSync(logPath) ? fs.readFileSync(logPath, 'utf8') : 'validation.log was not created.';
            const body = [
              `Validation failed on commit \`${context.sha}\`.`,
              '',
              `Run: ${runUrl}`,
              '',
              '<details><summary>Validation log</summary>',
              '',
              '```text',
              rawLog.slice(-55000),
              '```',
              '</details>',
            ].join('\n');
            if (existing) await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'open', body });
            else await github.rest.issues.create({ owner, repo, title, body });

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-validation-log
          path: site/validation.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload generated site for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-dist
          path: site/dist
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail workflow when validation fails
        if: steps.validation.outcome != 'success'
        run: exit 1
