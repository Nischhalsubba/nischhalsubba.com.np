name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: portfolio-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preview npm security lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only
          echo '--- package-lock remediation diff ---'
          git diff -- package-lock.json

      - name: Audit declared dependencies
        run: npm run audit:dependencies

      - name: Build and run repository audits
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm run validate
            git diff --exit-code
          } 2>&1 | tee validation.log

      - name: Publish validation result
        if: always()
        uses: actions/github-script@v8
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[CI] Portfolio validation failure';
            const { owner, repo } = context.repo;
            const outcome = process.env.VALIDATION_OUTCOME;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (outcome === 'success') {
              if (existing && existing.state === 'open') {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                  body: `Validation passed on ${context.sha}.\n\nRun: ${runUrl}`,
                });
              }
              return;
            }

            const rawLog = fs.existsSync('validation.log')
              ? fs.readFileSync('validation.log', 'utf8')
              : 'validation.log was not created.';
            const logTail = rawLog.slice(-55000);
            const body = [
              `Validation failed on commit \`${context.sha}\`.`,
              '',
              `Run: ${runUrl}`,
              '',
              '<details><summary>Validation log</summary>',
              '',
              '```text',
              logTail,
              '```',
              '</details>',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'open',
                body,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-validation-log
          path: validation.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload generated site for inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-dist
          path: dist
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail workflow when validation fails
        if: steps.validation.outcome != 'success'
        run: exit 1
