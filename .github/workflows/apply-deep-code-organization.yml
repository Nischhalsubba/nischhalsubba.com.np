name: Apply deep code organization

# Temporary migration workflow. It intentionally leaves workflow files unchanged in the migration commit because the GitHub Actions token cannot publish workflow-file changes.

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: deep-code-organization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.head_ref == 'agent/deep-code-organization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: agent/deep-code-organization

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Patch categorized page compatibility materialization
        run: node scripts/repository/fix-deep-layout-contract.cjs

      - name: Patch path-sensitive style and runtime contracts
        run: node scripts/repository/fix-deep-style-contracts.cjs

      - name: Apply responsibility-based source migration and documentation contracts
        run: node scripts/repository/apply-deep-organization.cjs

      - name: Restore workflow orchestration files
        run: git restore --source=HEAD --worktree .github/workflows

      - name: Remove one-shot migration scripts
        run: git rm -f scripts/repository/apply-deep-organization.cjs scripts/repository/fix-deep-layout-contract.cjs scripts/repository/fix-deep-style-contracts.cjs

      - name: Stage candidate source tree
        run: git add -A

      - name: Exclude temporary workflow from final-like Git index
        run: git rm --cached .github/workflows/apply-deep-code-organization.yml

      - name: Regenerate final-like tracked-file catalog
        run: |
          npm run docs:file-catalog
          git add docs/repository/file-catalog.md

      - name: Validate migrated repository before committing
        run: npm run validate

      - name: Restore unchanged temporary workflow in Git index
        run: git reset HEAD -- .github/workflows/apply-deep-code-organization.yml

      - name: Commit and push validated source migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: deepen source organization and documentation'
          git push origin HEAD:agent/deep-code-organization
