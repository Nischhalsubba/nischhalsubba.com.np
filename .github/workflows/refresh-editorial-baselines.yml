name: Refresh editorial visual baselines

on:
  push:
    branches: [gent/editorial-portfolio-redesign]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'test: refresh editorial visual baselines') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: gent/editorial-portfolio-redesign

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production output
        run: npm run build

      - name: Install visual runtime
        run: |
          npm install --no-save playwright@1.54.1 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Start preview server
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Generate reviewed redesign baselines
        run: UPDATE_VISUAL_BASELINES=1 node scripts/visual-regression.mjs

      - name: Commit visual baselines
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual/baselines/*.png
          if git diff --cached --quiet; then
            echo 'Visual baselines are already current.'
            exit 0
          fi
          git commit -m 'test: refresh editorial visual baselines'
          git push origin HEAD:gent/editorial-portfolio-redesign
