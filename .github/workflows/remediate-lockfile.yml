name: Remediate dependency lockfile

on:
  push:
    branches: [agent/accessibility-security-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-lockfile-remediation
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/accessibility-security-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install declared dependencies
        run: npm ci

      - name: Apply npm security remediation to lockfile
        shell: bash
        run: |
          set -euo pipefail
          # npm owns the exact transitive versions and integrity hashes here.
          npm audit fix --package-lock-only
          npm audit --audit-level=high

          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already contains npm security remediation.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: apply npm security lockfile remediation'
          git push origin HEAD:agent/accessibility-security-hardening
