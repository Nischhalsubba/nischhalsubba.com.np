name: Synchronize generated source

on:
  push:
    branches: [feat/complete-portfolio-qa]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-source-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore(build): synchronize canonical generated source') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/complete-portfolio-qa

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical source
        run: npm run generate

      - name: Commit synchronized source
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Canonical source is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(build): synchronize canonical generated source"
          git push origin HEAD:feat/complete-portfolio-qa
