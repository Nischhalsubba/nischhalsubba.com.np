name: Generate repository file catalog

on:
  push:
    branches: [agent/repository-structure-cleanup]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-file-catalog
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/repository-structure-cleanup

      - name: Remove one-shot helper from final tree
        run: git rm .github/workflows/generate-file-catalog.yml

      - name: Generate complete tracked-file catalog
        run: node scripts/repository/generate-file-catalog.cjs

      - name: Commit generated documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repository/file-catalog.md .github/workflows/generate-file-catalog.yml
          git commit -m 'docs: generate tracked-file repository catalog'
          git push origin HEAD:agent/repository-structure-cleanup
