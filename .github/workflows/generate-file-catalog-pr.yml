name: Refresh repository file catalog for PR

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/repository-catalog-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout catalog-sync branch
        uses: actions/checkout@v6
        with:
          ref: agent/repository-catalog-sync

      - name: Remove one-shot helper from final tree
        run: git rm .github/workflows/generate-file-catalog-pr.yml

      - name: Regenerate file catalog from current tracked tree
        run: node scripts/repository/generate-file-catalog.cjs

      - name: Commit synchronized catalog and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: synchronize repository file catalog'
          git push origin HEAD:agent/repository-catalog-sync
