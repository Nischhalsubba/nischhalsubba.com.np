name: Live button motion diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-motion:
    if: github.head_ref == 'fix/live-button-motion-observability'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Audit live production button motion
        env:
          AUDIT_BASE_URL: https://nischhalsubba.com.np
        run: npm run test:button-motion:browser

      - name: Probe live motion capability contexts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const cases = [
            ['desktop', { viewport: { width: 1440, height: 900 }, reducedMotion: 'no-preference' }],
            ['reduced-motion', { viewport: { width: 1440, height: 900 }, reducedMotion: 'reduce' }],
            ['touch-capable', { viewport: { width: 1440, height: 900 }, reducedMotion: 'no-preference', hasTouch: true }],
          ];
          for (const [name, options] of cases) {
            const context = await browser.newContext(options);
            const page = await context.newPage();
            await page.goto('https://nischhalsubba.com.np/', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1600);
            const selector = '.nrs-layout-home-hero-actions .nrs-uploaded-btn-primary, .nrs-uploaded-actions .nrs-uploaded-btn-primary, .hero-actions .btn.btn-primary';
            const before = await page.evaluate((target) => ({
              fineHover: matchMedia('(hover: hover) and (pointer: fine)').matches,
              anyFineHover: matchMedia('(any-hover: hover) and (any-pointer: fine)').matches,
              reduce: matchMedia('(prefers-reduced-motion: reduce)').matches,
              gsap: window.gsap?.version || null,
              decorated: document.querySelector(target)?.dataset.nrsMotionDecorated || null,
            }), selector);
            const target = page.locator(selector).first();
            if (await target.count()) {
              await target.hover({ force: true });
              await page.waitForTimeout(260);
            }
            const after = await page.evaluate((target) => ({
              hovered: document.querySelector(target)?.classList.contains('is-motion-hovered') || false,
              transform: document.querySelector(target) ? getComputedStyle(document.querySelector(target)).transform : null,
            }), selector);
            console.log(JSON.stringify({ name, ...before, ...after }));
            await context.close();
          }
          await browser.close();
          NODE
