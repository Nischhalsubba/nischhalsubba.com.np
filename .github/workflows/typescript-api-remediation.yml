name: Temporary TypeScript API remediation

on:
  push:
    branches:
      - chore/2026-security-baseline
    paths:
      - 'site/package.json'
      - '.github/workflows/typescript-api-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-typescript-api-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/2026-security-baseline
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Switch repository audit to the TypeScript 6 compatibility API
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'site/scripts/repository/audit-code-documentation.cjs';
          const before = "const ts = require('typescript');";
          const after = "const typescript6 = require('@typescript/typescript6');\nconst ts = typescript6.default || typescript6;";
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(before) && !source.includes(after)) {
            throw new Error('Expected TypeScript compiler API import was not found.');
          }
          if (source.includes(before)) fs.writeFileSync(path, source.replace(before, after));
          NODE
      - name: Refresh lockfile
        working-directory: site
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify dependency audit
        working-directory: site
        run: npm audit --audit-level=low
      - name: Verify documentation audit
        working-directory: site
        run: node scripts/repository/audit-code-documentation.cjs
      - name: Commit compatibility changes
        run: |
          if git diff --quiet -- site/package-lock.json site/scripts/repository/audit-code-documentation.cjs; then
            echo 'Compatibility files already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/package-lock.json site/scripts/repository/audit-code-documentation.cjs
          git commit -m 'fix: use TypeScript 6 compiler API compatibility layer'
          git push origin HEAD:chore/2026-security-baseline
