name: Sanitize function contracts

# Temporary PR-only workflow. It publishes only source documentation cleanup; the workflow itself is removed through the GitHub connector after success.

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: sanitize-function-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sanitize:
    if: github.head_ref == 'agent/deep-code-organization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout deep organization branch
        uses: actions/checkout@v6
        with:
          ref: agent/deep-code-organization

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Rebuild exactly one contract per function and callback
        run: node scripts/repository/sanitize-function-contracts.cjs

      - name: Remove one-shot sanitizer script
        run: git rm -f scripts/repository/sanitize-function-contracts.cjs

      - name: Stage final-like source tree
        run: git add -A

      - name: Exclude temporary workflow from final-like Git index
        run: git rm --cached .github/workflows/sanitize-function-contracts.yml

      - name: Regenerate final-like tracked-file catalog
        run: |
          npm run docs:file-catalog
          git add docs/repository/file-catalog.md

      - name: Validate strict documentation and production build before committing
        run: npm run validate

      - name: Restore unchanged temporary workflow in Git index
        run: git reset HEAD -- .github/workflows/sanitize-function-contracts.yml

      - name: Commit and push sanitized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: enforce one detailed contract per function'
          git push origin HEAD:agent/deep-code-organization
