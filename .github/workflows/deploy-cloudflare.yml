name: Verify Cloudflare Workers production

on:
  workflow_run:
    workflows: ["Browser audit"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCTION_URL: https://nischhalsubba.com.np
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"

      - name: Wait for Workers Builds and verify production
        id: cloudflare
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo "Cloudflare Workers Builds is the production deployer."
            echo "Waiting for validated main commit $DEPLOY_SHA or a newer descendant to reach $PRODUCTION_URL."

            is_acceptable_live_commit() {
              local expected="$1"
              local live="$2"
              [ -n "$live" ] || return 1
              [ "$live" = "$expected" ] && return 0

              local compare_status
              compare_status=$(curl -fsS --max-time 10 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$expected...$live" \
                | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).status||'')}catch{console.log('')}})" \
                || true)
              [ "$compare_status" = "ahead" ] || [ "$compare_status" = "identical" ]
            }

            PROVENANCE_OK=0
            ACCEPTED_SHA=''
            for attempt in $(seq 1 36); do
              LIVE_INFO=$(curl -fsS --max-time 10 "$PRODUCTION_URL/build-info.json" || true)
              LIVE_SHA=$(printf '%s' "$LIVE_INFO" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit||'')}catch{console.log('')}})")
              LIVE_BRANCH=$(printf '%s' "$LIVE_INFO" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).branch||'')}catch{console.log('')}})")
              LIVE_PROVIDER=$(printf '%s' "$LIVE_INFO" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).provider||'')}catch{console.log('')}})")
              echo "Provenance attempt $attempt: live=${LIVE_SHA:-unavailable} branch=${LIVE_BRANCH:-unknown} provider=${LIVE_PROVIDER:-unknown} validated=$DEPLOY_SHA"

              if [ "$LIVE_BRANCH" = "main" ] && [ "$LIVE_PROVIDER" = "cloudflare-workers" ] && is_acceptable_live_commit "$DEPLOY_SHA" "$LIVE_SHA"; then
                PROVENANCE_OK=1
                ACCEPTED_SHA="$LIVE_SHA"
                break
              fi
              sleep 10
            done

            [ "$PROVENANCE_OK" = "1" ] || {
              echo "Production did not reach validated commit $DEPLOY_SHA or a newer main-branch descendant."
              echo "Check Workers Builds branch control, production deploy status, and the Wrangler production route for nischhalsubba.com.np."
              exit 1
            }

            echo "Accepted production commit $ACCEPTED_SHA for validated baseline $DEPLOY_SHA."

            CONTACT_HTML=$(curl -fsS --max-time 15 "$PRODUCTION_URL/contact")
            printf '%s' "$CONTACT_HTML" | grep -q 'id="contact-form"' || {
              echo "Production contact page is missing the contact form."
              exit 1
            }
            printf '%s' "$CONTACT_HTML" | grep -q 'action="/api/contact"' || {
              echo "Production contact form is not using the first-party endpoint as its static action."
              exit 1
            }
            if printf '%s' "$CONTACT_HTML" | grep -qi 'The protected form is unavailable'; then
              echo "Production contact page still contains the old unavailable-form state."
              exit 1
            fi

            HOME_HTML=$(curl -fsS --max-time 15 "$PRODUCTION_URL/")
            printf '%s' "$HOME_HTML" | grep -q 'agent-portfolio' || {
              echo "Production homepage is not serving the editorial redesign shell."
              exit 1
            }

            echo "Cloudflare Workers production provenance and critical-page smoke checks passed."
          } 2>&1 | tee cloudflare-production.log

      - name: Publish production verification result
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_OUTCOME: ${{ steps.cloudflare.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[CI] Cloudflare production deployment failure';
            const { owner, repo } = context.repo;
            const outcome = process.env.DEPLOY_OUTCOME;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (outcome === 'success') {
              if (existing && existing.state === 'open') {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                  body: `Cloudflare Workers production verification passed for validated main commit \`${process.env.DEPLOY_SHA}\` or a newer descendant on main.\n\nRun: ${runUrl}`,
                });
              }
              return;
            }

            const rawLog = fs.existsSync('cloudflare-production.log')
              ? fs.readFileSync('cloudflare-production.log', 'utf8')
              : 'cloudflare-production.log was not created.';
            const body = [
              `Cloudflare Workers production verification failed for validated main commit \`${process.env.DEPLOY_SHA}\`.`,
              '',
              'Workers Builds is the expected production deployer. The live commit must equal the validated commit or be a newer descendant of it on `main`.',
              '',
              `Run: ${runUrl}`,
              '',
              '<details><summary>Verification log</summary>',
              '',
              '```text',
              rawLog.slice(-55000),
              '```',
              '</details>',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'open',
                state_reason: 'reopened',
                body,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Upload production verification log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-production-log
          path: cloudflare-production.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail workflow when production verification fails
        if: steps.cloudflare.outcome != 'success'
        run: exit 1
