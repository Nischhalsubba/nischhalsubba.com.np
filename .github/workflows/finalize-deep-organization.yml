name: Finalize deep organization

on:
  push:
    branches: [agent/deep-code-organization]

permissions:
  contents: write

concurrency:
  group: finalize-deep-organization
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'Stabilize interface audit after source reorganization') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: agent/deep-code-organization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Repair moved runtime path and hover audit timing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const polishPath = 'scripts/ensure-interface-polish.cjs';
          let polish = fs.readFileSync(polishPath, 'utf8');
          const oldRuntimeFragment = "'features', 'agent-portfolio.js'";
          const replacementCount = polish.split(oldRuntimeFragment).length - 1;
          if (replacementCount !== 2) {
            throw new Error(`Expected two stale agent-portfolio runtime paths, found ${replacementCount}.`);
          }
          polish = polish.replaceAll(oldRuntimeFragment, "'features', 'portfolio', 'agent-portfolio.js'");
          fs.writeFileSync(polishPath, polish, 'utf8');

          const auditPath = 'scripts/browser-interface-polish-audit.mjs';
          let audit = fs.readFileSync(auditPath, 'utf8');

          const helperAnchor = "const standard = await browser.newContext({ reducedMotion: 'no-preference' });";
          if (!audit.includes(helperAnchor)) throw new Error('Could not locate Interface polish helper insertion point.');

          const helpers = `/**
           * Function contract: readProjectRowStyle
           * Purpose: Read the visual properties used to prove that a homepage project row provides visible hover feedback.
           * Inputs: \`row\`, a Playwright locator for one project row.
           * Side effects: Reads computed browser styles for the row and its heading; does not mutate production DOM state.
           * Returns: Promise resolving to an object containing the computed row background and project-title color.
           */
          async function readProjectRowStyle(row) {
            return row.evaluate( /** Callback contract: Read the computed background and heading color from the current project-row element. Inputs: \`element\` Side effects: Reads DOM/computed-style state only. Returns: Object containing \`background\` and \`title\` CSS color values. */ (element) => ({
              background: getComputedStyle(element).backgroundColor,
              title: getComputedStyle(element.querySelector('h3')).color,
            }));
          }

          /**
           * Function contract: waitForProjectRowFeedback
           * Purpose: Poll the project-row styles after hover until the visible feedback begins, avoiding a race with page-entry and reveal motion.
           * Inputs: \`page\`, \`row\`, \`before\`, and optional \`timeoutMs\`/\`pollMs\` timing bounds.
           * Side effects: Waits briefly and reads computed browser styles; does not alter the production interaction or DOM structure.
           * Returns: Promise resolving to the first changed style snapshot, or the final unchanged snapshot when the timeout is reached.
           */
          async function waitForProjectRowFeedback(page, row, before, { timeoutMs = 1200, pollMs = 60 } = {}) {
            const startedAt = Date.now();
            let after = before;
            while (Date.now() - startedAt < timeoutMs) {
              await page.waitForTimeout(pollMs);
              after = await readProjectRowStyle(row);
              if (after.background !== before.background || after.title !== before.title) return after;
            }
            return after;
          }

          `;
          audit = audit.replace(helperAnchor, `${helpers}${helperAnchor}`);

          const interactionStart = "    const row = page.locator('.agent-project-row').first();";
          const interactionEnd = "    const button = page.locator('.agent-btn').first();";
          const startIndex = audit.indexOf(interactionStart);
          const endIndex = audit.indexOf(interactionEnd, startIndex);
          if (startIndex === -1 || endIndex === -1) throw new Error('Could not locate project-row interaction assertion block.');

          const replacement = `    const row = page.locator('.agent-project-row').first();
              const before = await readProjectRowStyle(row);
              await row.hover();
              const after = await waitForProjectRowFeedback(page, row, before);
              if (before.background === after.background && before.title === after.title) {
                throw new Error('hover produces no visible feedback');
              }

          `;
          audit = audit.slice(0, startIndex) + replacement + audit.slice(endIndex);
          fs.writeFileSync(auditPath, audit, 'utf8');
          NODE

      - name: Enforce code documentation contracts
        run: npm run audit:code-docs

      - name: Build production output
        run: npm run build

      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start preview server
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/finalize-deep-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/finalize-deep-preview.log
          exit 1

      - name: Run interface polish browser audit
        run: node scripts/browser-interface-polish-audit.mjs

      - name: Commit validated source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ensure-interface-polish.cjs scripts/browser-interface-polish-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize interface audit after source reorganization"
          git push origin HEAD:agent/deep-code-organization
