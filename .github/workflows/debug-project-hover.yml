name: Debug project hover

# Temporary PR-only workflow used to inspect the one failing Interface polish hover case. Remove after diagnosis.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: debug-project-hover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  debug:
    if: github.head_ref == 'agent/deep-code-organization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIT_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout deep organization PR
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build production output
        run: npm run build

      - name: Install Chromium diagnostic runtime
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start preview server
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/project-hover-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/project-hover-preview.log
          exit 1

      - name: Print focused project-hover diagnostics
        run: node scripts/repository/debug-project-hover.mjs
