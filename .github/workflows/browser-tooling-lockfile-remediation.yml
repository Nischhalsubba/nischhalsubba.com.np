name: Temporary browser tooling lockfile remediation

on:
  push:
    branches:
      - chore/2026-security-baseline
    paths:
      - 'site/package.json'
      - '.github/workflows/browser-tooling-lockfile-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-browser-tooling-lockfile-remediation
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/2026-security-baseline
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Refresh locked browser tooling
        working-directory: site
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify zero known dependency vulnerabilities
        working-directory: site
        run: npm audit --audit-level=low
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- site/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/package-lock.json
          git commit -m 'chore: lock portfolio browser tooling'
          git push origin HEAD:chore/2026-security-baseline
